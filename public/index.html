<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoVibe | Music Hub</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 20px; margin-bottom: 15px; }
        .msg { background: #334155; padding: 10px; border-radius: 10px; margin: 5px 0; }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: none; }
        button { width: 100%; padding: 10px; background: #10b981; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="app">
    <div id="setup" class="card">
        <h2>GeoVibe 🌍</h2>
        <input type="text" id="username" placeholder="Tu Apodo">
        <button onclick="start()">Entrar al Radar</button>
    </div>

    <div id="chat-ui" style="display:none;">
        <div class="card">
            <h3 id="room-title">Mi Sala</h3>
            <iframe id="spotify-player" src="" width="100%" height="80" frameborder="0"></iframe>
            <input type="text" id="song-input" placeholder="ID de canción Spotify (ej: 4cOdK2wGLETKBW3PvgPWqT)">
            <button onclick="addSong()" style="background:#1db954;">Añadir Canción</button>
        </div>
        <div id="chat-box" class="card" style="height: 200px; overflow-y: auto;"></div>
        <input type="text" id="msg-input" placeholder="Mensaje...">
        <button onclick="sendMsg()">Enviar Mensaje</button>
    </div>
</div>

<script>
    const socket = io("https://tu-backend-en-render.onrender.com");
    let currentRoomId = "global";

    function start() {
        const name = document.getElementById('username').value;
        navigator.geolocation.getCurrentPosition(pos => {
            socket.emit('update_location', { username: name, lat: pos.coords.latitude, lng: pos.coords.longitude });
            document.getElementById('setup').style.display = 'none';
            document.getElementById('chat-ui').style.display = 'block';
        });
    }

    function addSong() {
        const uri = document.getElementById('song-input').value;
        socket.emit('add_song', { roomId: currentRoomId, uri });
    }

    socket.on('play_now', (uri) => {
        document.getElementById('spotify-player').src = `https://open.spotify.com/embed/track/${uri}`;
    });

    function sendMsg() {
        const msg = document.getElementById('msg-input').value;
        socket.emit('chat_msg', { roomId: currentRoomId, msg, user: document.getElementById('username').value });
        document.getElementById('msg-input').value = '';
    }

    socket.on('new_msg', (data) => {
        const box = document.getElementById('chat-box');
        box.innerHTML += `<div class="msg"><b>${data.user}:</b> ${data.msg}</div>`;
    });
</script>
</body>
</html>
