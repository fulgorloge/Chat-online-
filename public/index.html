<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nox | Watch Together</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Barra de Navegación Superior -->
    <header class="top-navbar">
        <div class="nav-brand">
            <h1>NOX</h1>
            <span class="room-badge" id="current-room-name">General</span>
            <div class="live-indicator">
                <span class="live-dot"></span>
                <span>EN VIVO</span>
            </div>
        </div>
        
        <div class="nav-actions">
            <button id="host-panel-btn" class="host-btn">Panel Anfitrión</button>
            <button id="change-room-btn" class="secondary-action-btn">Cambiar Sala</button>
        </div>
    </header>

    <!-- Contenedor Principal de la Interfaz -->
    <div class="app-container">
        
        <!-- Sección Izquierda: Reproductor y Stream -->
        <div class="main-content">
            <div class="video-container" id="media-player-container">
                <video id="video-player" controls>
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                    Tu navegador no soporta el elemento de vídeo.
                </video>
                <div id="external-player-target"></div>
            </div>

            <div class="stream-info">
                <div class="streamer-details">
                    <div class="avatar-placeholder"></div>
                    <div>
                        <h3 id="streamer-name">Anfitrión de Nox</h3>
                        <p id="stream-category">Categoría: Multimedia Interactiva</p>
                    </div>
                </div>
                <div class="viewer-count">Espectadores: <span id="count">1</span></div>
            </div>
        </div>

        <!-- Sección Derecha: Chat en Vivo Estilo Kick -->
        <div class="chat-container">
            <div class="chat-header">
                <h3>Chat del Stream</h3>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <form id="chat-form" class="chat-input-form">
                <div class="input-wrapper">
                    <input type="text" id="chat-input" placeholder="Envía un mensaje..." autocomplete="off" required>
                    <button type="submit">Enviar</button>
                </div>
            </form>
        </div>

    </div>

    <!-- Modal: Panel de Control del Anfitrión -->
    <div id="host-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Panel de Control del Anfitrión</h2>
            <p>Cambia la fuente de entretenimiento en tiempo real para la sala.</p>
            
            <div class="form-group">
                <label for="platform-select">Selecciona la plataforma:</label>
                <select id="platform-select">
                    <option value="video">Enlace MP4 Directo</option>
                    <option value="youtube">YouTube (URL)</option>
                    <option value="spotify">Spotify (Enlace / URI)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="media-url-input">URL o ID del contenido:</label>
                <input type="text" id="media-url-input" placeholder="Ej: https://www.youtube.com/watch?v=...">
            </div>

            <div class="modal-buttons">
                <button id="load-media-btn" class="primary-btn">Cargar y Sincronizar</button>
                <button id="close-modal-btn" class="secondary-btn">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
