<!-- Reemplaza el bloque <script> del cliente con esta lógica mejorada -->
<script>
    const socket = io(window.location.origin, { transports: ['websocket', 'polling'] });

    let userProfile = { name: '', role: '🎧', bio: '', wallet: 0 };
    let currentRoom = null;
    let typingTimer = null;

    window.addEventListener('DOMContentLoaded', () => {
        const savedUser = localStorage.getItem('geovibe_user');
        if (savedUser) {
            try {
                userProfile = JSON.parse(savedUser);
                if (userProfile && userProfile.name) {
                    loadMainHud();
                    return;
                }
            } catch(e) {
                localStorage.removeItem('geovibe_user');
            }
        }
        document.getElementById('login-screen').style.display = 'block';
    });

    function initGoogleLogin() {
        if (typeof google === 'undefined' || !google.accounts) {
            // Fallback si el script de Google tarda en cargar en móviles
            let manualName = prompt("Ingresa tu nombre de operador (Modo Alternativo):");
            if (manualName) {
                userProfile.name = manualName;
                document.getElementById('setup-handle').value = manualName;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'block';
            }
            return;
        }

        google.accounts.id.initialize({
            client_id: "217257383894-svk08tdkru8n294ouema10flce0tbric.apps.googleusercontent.com",
            callback: handleGoogleAuthResponse
        });
        google.accounts.id.prompt((notification) => {
            if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                // Si el navegador bloquea el One Tap, forzamos un login directo por prompt o input
                let manualName = prompt("Inicia sesión con tu nombre de operador:");
                if (manualName) {
                    userProfile.name = manualName;
                    document.getElementById('setup-handle').value = manualName;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('setup-screen').style.display = 'block';
                }
            }
        });
    }

    async function handleGoogleAuthResponse(response) {
        try {
            const res = await fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: response.credential })
            });
            const data = await res.json();
            if (data.success) {
                userProfile.name = data.user.name;
                document.getElementById('setup-handle').value = data.user.name;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'block';
            }
        } catch (err) {
            userProfile.name = "Operador " + Math.floor(Math.random() * 1000);
            document.getElementById('setup-handle').value = userProfile.name;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
        }
    }

    function completeSetup() {
        const handle = document.getElementById('setup-handle').value.trim();
        if (!handle) { alert('Por favor ingresa un nombre de operador.'); return; }
        userProfile.name = handle;
        userProfile.role = document.getElementById('setup-role').value;
        userProfile.bio = document.getElementById('setup-bio').value;
        if (!userProfile.wallet) userProfile.wallet = 100;
        
        localStorage.setItem('geovibe_user', JSON.stringify(userProfile));
        loadMainHud();
    }

    function loadMainHud() {
        document.getElementById('header-username').innerText = userProfile.name;
        document.getElementById('header-avatar').innerText = userProfile.role || '🎧';
        document.getElementById('profile-handle').value = userProfile.name;
        document.getElementById('profile-bio').value = userProfile.bio || '';
        updateWalletUI();

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('main-hud').style.display = 'flex';
    }

    function logoutSession() {
        if (confirm('¿Deseas cerrar sesión y cambiar de cuenta?')) {
            localStorage.removeItem('geovibe_user');
            location.reload();
        }
    }

    // Resto de funciones (createRoom, chat, etc.) se mantienen igual...
</script>
