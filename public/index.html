<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoVibe | Premium Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --glass: rgba(255, 255, 255, 0.05);
            --bg: #0f172a;
        }

        body { 
            background: #030014; color: white; font-family: 'Outfit', sans-serif;
            margin: 0; display: flex; justify-content: center; min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animación de entrada suave */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        #app { width: 90%; max-width: 420px; padding-top: 50px; animation: fadeIn 0.8s ease-out; }

        .card { 
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); padding: 25px;
            border-radius: 30px; margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        h2 { font-weight: 900; font-size: 2rem; margin-bottom: 10px; letter-spacing: -1px; }

        input { 
            width: 100%; padding: 15px; border-radius: 15px; border: 2px solid transparent;
            background: rgba(0,0,0,0.3); color: white; box-sizing: border-box;
            transition: 0.3s; margin-bottom: 10px;
        }
        input:focus { border-color: var(--primary); outline: none; background: rgba(0,0,0,0.5); }

        button { 
            width: 100%; padding: 15px; border-radius: 15px; border: none;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            color: white; font-weight: 700; cursor: pointer;
            transition: transform 0.2s, filter 0.3s;
        }
        button:hover { transform: translateY(-2px); filter: brightness(1.2); }

        .msg { 
            padding: 12px 18px; border-radius: 20px; margin: 8px 0;
            background: rgba(255,255,255,0.08); font-size: 0.95rem;
            animation: fadeIn 0.4s ease;
        }

        /* Indicador de "Streaming" */
        .spotify-container { border-radius: 20px; overflow: hidden; margin-top: 15px; box-shadow: 0 0 20px rgba(29, 185, 84, 0.2); }
    </style>
</head>
<body>

<div id="app">
    <div id="setup" class="card">
        <h2>GeoVibe</h2>
        <p style="opacity: 0.6; margin-bottom: 20px;">Sincronización espacial en tiempo real.</p>
        <input type="text" id="username" placeholder="¿Cómo te llamas?">
        <button onclick="start()">Conectar al Radar</button>
    </div>

    <div id="chat-ui" style="display:none;">
        <div class="card">
            <h3 style="margin-top:0;">Ahora sonando</h3>
            <div class="spotify-container">
                <iframe id="spotify-player" src="" width="100%" height="80" frameborder="0"></iframe>
            </div>
            <input type="text" id="song-input" placeholder="Spotify Track ID" style="margin-top:15px;">
            <button onclick="addSong()">Actualizar Track</button>
        </div>
        
        <div id="chat-box" class="card" style="height: 250px; overflow-y: auto;"></div>
        
        <div class="card" style="padding: 15px; display: flex; gap: 10px;">
            <input type="text" id="msg-input" placeholder="Mensaje..." style="margin:0;">
            <button onclick="sendMsg()" style="width: auto; padding: 0 20px;">➤</button>
        </div>
    </div>
</div>

<script>
    const socket = io("https://chat-online-110g.onrender.com");
    let currentRoomId = "global";

    function start() {
        const name = document.getElementById('username').value;
        if (!name) return alert("Ingresa un apodo");
        
        navigator.geolocation.getCurrentPosition(pos => {
            socket.emit('update_location', { username: name, lat: pos.coords.latitude, lng: pos.coords.longitude });
            document.getElementById('setup').style.display = 'none';
            document.getElementById('chat-ui').style.display = 'block';
        });
    }

    function addSong() {
        const uri = document.getElementById('song-input').value;
        socket.emit('add_song', { roomId: currentRoomId, uri });
    }

    socket.on('play_now', (uri) => {
        document.getElementById('spotify-player').src = `https://open.spotify.com/embed/track/${uri}`;
    });

    function sendMsg() {
        const input = document.getElementById('msg-input');
        if (!input.value) return;
        socket.emit('chat_msg', { roomId: currentRoomId, msg: input.value, user: document.getElementById('username').value });
        input.value = '';
    }

    socket.on('new_msg', (data) => {
        const box = document.getElementById('chat-box');
        box.innerHTML += `<div class="msg"><b>${data.user}</b>: ${data.msg}</div>`;
        box.scrollTop = box.scrollHeight;
    });
</script>
</body>
</html>
