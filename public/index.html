<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoVibe | Project Z Ultimate Enterprise Hub + P2P ZC Exchange, Auth & IG Feed</title>
    <!-- Librerías Externas -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root { 
            --pz-bg: #04060a;
            --pz-surface: #0b0f17;
            --pz-surface-glass: rgba(11, 15, 23, 0.92);
            --pz-border: #1a2336;
            --pz-border-glow: #25334d;
            --pz-primary: #2563eb;
            --pz-primary-glow: rgba(37, 99, 235, 0.4);
            --pz-accent: #059669;
            --pz-neon: #06b6d4;
            --pz-neon-glow: rgba(6, 182, 212, 0.25);
            --pz-pink: #db2777;
            --pz-amber: #d97706;
            --pz-netflix: #e50914;
            --pz-sales: #8b5cf6; 
            --pz-economy: #eab308;
            --pz-google: #ea4335;
            --pz-facebook: #1877f2;
            --pz-instagram: #e1306c;
            --pz-text: #f8fafc;
            --pz-muted: #64748b;
            --pz-danger: #dc2626;
        }

        * { box-sizing: border-box; }

        body { 
            background: var(--pz-bg); color: var(--pz-text); font-family: 'Outfit', sans-serif; 
            margin: 0; padding: 4px; display: flex; justify-content: center; 
            min-height: 100vh; overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(37, 99, 235, 0.03) 0%, transparent 40%);
        }

        #app { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 6px; }

        .pz-card { 
            background: var(--pz-surface-glass); backdrop-filter: blur(24px); 
            border: 1px solid var(--pz-border); padding: 12px; 
            border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            position: relative; overflow: hidden;
            transition: border-color 0.3s ease;
        }
        .pz-card:hover { border-color: var(--pz-border-glow); }
        
        .pz-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
            background: var(--pz-neon); box-shadow: 0 0 10px var(--pz-neon);
            border-top-left-radius: 12px; border-bottom-left-radius: 12px;
        }

        h2, h3 { margin: 0 0 8px 0; font-weight: 700; letter-spacing: -0.3px; }
        h2 { font-size: 1.05rem; color: var(--pz-neon); display: flex; align-items: center; gap: 8px; }

        label { font-size: 0.65rem; color: var(--pz-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        input, select, textarea { 
            width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--pz-border); 
            background: rgba(2, 4, 8, 0.7); color: white; box-sizing: border-box; margin: 4px 0; font-family: inherit;
            font-size: 0.8rem; transition: all 0.25s ease;
        }
        input:focus, select:focus, textarea:focus { 
            border-color: var(--pz-neon); outline: none; 
            box-shadow: 0 0 12px var(--pz-neon-glow); 
            background: rgba(4, 8, 16, 0.9);
        }

        button { 
            width: 100%; padding: 8px 12px; border-radius: 8px; border: none; 
            background: var(--pz-primary); color: white; font-weight: 600; cursor: pointer; 
            margin-top: 4px; transition: all 0.25s ease; font-family: inherit; font-size: 0.8rem;
            box-shadow: 0 4px 12px var(--pz-primary-glow);
        }
        button:hover { filter: brightness(1.15); transform: translateY(-1px); box-shadow: 0 6px 16px var(--pz-primary-glow); }
        button:active { transform: translateY(0); }

        .pz-oauth-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--pz-border);
            font-weight: 600; cursor: pointer; font-size: 0.8rem; font-family: inherit; margin-top: 6px;
            background: rgba(255,255,255,0.04); color: white; transition: all 0.2s ease;
        }
        .pz-oauth-btn:hover { background: rgba(255,255,255,0.08); }
        .pz-oauth-google { border-color: rgba(234, 67, 53, 0.4); }
        .pz-oauth-google:hover { background: rgba(234, 67, 53, 0.15); }
        .pz-oauth-facebook { border-color: rgba(24, 119, 242, 0.4); }
        .pz-oauth-facebook:hover { background: rgba(24, 119, 242, 0.15); }
        .pz-oauth-instagram { border-color: rgba(225, 48, 108, 0.4); }
        .pz-oauth-instagram:hover { background: rgba(225, 48, 108, 0.15); }

        .auth-switch-link {
            text-align: center; margin-top: 8px; font-size: 0.7rem; color: var(--pz-muted);
        }
        .auth-switch-link span { color: var(--pz-neon); cursor: pointer; font-weight: 700; text-decoration: underline; }

        .pz-header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--pz-surface); padding: 8px 12px; border-radius: 10px;
            border: 1px solid var(--pz-border); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .pz-tab-content { display: none; flex-direction: column; gap: 8px; animation: fadeIn 0.3s ease; }
        .pz-tab-content.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: var(--pz-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--pz-neon); }
    </style>
</head>
<body>

<div id="app">
    
    <!-- MÓDULO DE AUTENTICACIÓN -->
    <div id="login-screen" class="pz-card" style="margin-top: 15px; text-align: center; padding: 16px;">
        <h2><i class="fa-solid fa-shield-halved"></i> GeoVibe // Core Security</h2>
        <p id="auth-subtitle" style="color: var(--pz-muted); font-size: 0.75rem; margin-bottom: 10px;">Inicia sesión con tu cuenta o regístrate</p>
        
        <div style="display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px;">
            <button class="pz-oauth-btn pz-oauth-google" onclick="socialAuth('Google', '🌐')">
                <i class="fa-brands fa-google" style="color: var(--pz-google);"></i> Continuar con Google
            </button>
            <button class="pz-oauth-btn pz-oauth-facebook" onclick="socialAuth('Facebook', '💙')">
                <i class="fa-brands fa-facebook" style="color: var(--pz-facebook);"></i> Continuar con Facebook
            </button>
            <button class="pz-oauth-btn pz-oauth-instagram" onclick="socialAuth('Instagram', '📸')">
                <i class="fa-brands fa-instagram" style="color: var(--pz-instagram);"></i> Continuar con Instagram
            </button>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; margin: 6px 0; color: var(--pz-muted); font-size: 0.65rem;">
            <div style="flex: 1; height: 1px; background: var(--pz-border);"></div>
            O CORREO / USUARIO
            <div style="flex: 1; height: 1px; background: var(--pz-border);"></div>
        </div>

        <input type="text" id="auth-user" placeholder="Correo electrónico o Usuario...">
        <input type="password" id="auth-pass" placeholder="Contraseña segura...">
        
        <button id="auth-action-btn" onclick="handleAuthSubmit()" style="margin-top: 6px;"><i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión</button>
    </div>

    <!-- INTERFAZ PRINCIPAL (HUD) -->
    <div id="main-hud" style="display:none; flex-direction: column; gap: 8px;">
        
        <div class="pz-header">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span id="header-avatar" style="font-size: 1.1rem;">🎧</span>
                <div>
                    <span id="header-username" style="font-weight: 700; font-size: 0.8rem; display: block;">Operador</span>
                    <span style="font-size: 0.55rem; color: var(--pz-muted); display:flex; align-items:center; gap:4px;"><span id="status-dot" style="width:6px; height:6px; background:var(--pz-accent); border-radius:50%; display:inline-block;"></span> Sesión Segura Activa</span>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
                <div style="background: rgba(234, 179, 8, 0.15); border: 1px solid var(--pz-economy); padding: 2px 6px; border-radius: 6px; display: flex; align-items: center; gap: 4px;" title="Tus Z-Coins">
                    <i class="fa-solid fa-coins" style="color: var(--pz-economy); font-size: 0.7rem;"></i>
                    <span id="header-wallet" style="font-weight: 700; font-size: 0.7rem; color: var(--pz-economy);">100 ZC</span>
                </div>
            </div>
        </div>

        <!-- SALAS / PANEL CENTRAL -->
        <div id="pz-rooms" class="pz-tab-content active">
            <div class="pz-card">
                <h2><i class="fa-solid fa-satellite-dish"></i> Sincronización Telemétrica GPS</h2>
                <p style="font-size: 0.75rem; color: var(--pz-muted);">Bienvenido a la red descentralizada de GeoVibe. Conexión establecida correctamente con el nodo central.</p>
            </div>
        </div>

    </div>

</div>

<script>
    const socket = io();

    function socialAuth(provider, emoji) {
        if (provider === 'Google') {
            google.accounts.id.initialize({
                client_id: "217257383894-svk08tdkru8n294ouema10flce0tbric.apps.googleusercontent.com", 
                callback: handleGoogleResponse
            });
            google.accounts.id.prompt();
        } else {
            alert(`Iniciando protocolo de enlace con ${provider} ${emoji}`);
            simulateSuccessfulLogin(provider);
        }
    }

    async function handleGoogleResponse(response) {
        try {
            const res = await fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: response.credential })
            });
            const data = await res.json();
            
            if (data.success) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-hud').style.display = 'flex';
                document.getElementById('header-username').innerText = data.user.name;
                document.getElementById('header-wallet').innerText = '100 ZC';
            }
        } catch (err) {
            console.error('Error de autenticación:', err);
        }
    }

    function simulateSuccessfulLogin(providerName) {
        const user = {
            name: `Operador_${providerName}`,
            avatar: '🎧',
            wallet: 100
        };
        
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-hud').style.display = 'flex';
        
        document.getElementById('header-username').innerText = user.name;
        document.getElementById('header-avatar').innerText = user.avatar;
        document.getElementById('header-wallet').innerText = `${user.wallet} ZC`;
    }

    function handleAuthSubmit() {
        const userVal = document.getElementById('auth-user').value;
        if (!userVal) {
            alert('Por favor ingresa un correo o usuario válido.');
            return;
        }
        simulateSuccessfulLogin('Local');
    }
</script>

</body>
</html>
