<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoVibe | Hub Multimedia Sincronizado</title>
    <!-- Fuentes y Estilos Externos -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root { 
            --bg-deep: #07090e;
            --surface: #0f141d;
            --surface-glass: rgba(15, 20, 29, 0.85);
            --border: #212d3d;
            --border-glow: #38bdf8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --neon: #38bdf8;
            --economy: #f59e0b;
            --danger: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            background: var(--bg-deep); color: var(--text-main); font-family: 'Outfit', sans-serif; 
            margin: 0; padding: 12px; display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; 
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.05) 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(59, 130, 246, 0.05) 0%, transparent 45%);
        }

        #app { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }

        .pz-card { 
            background: var(--surface-glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border); padding: 16px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        h2 { font-size: 1rem; color: var(--neon); display: flex; align-items: center; gap: 10px; margin: 0 0 12px 0; font-weight: 600; letter-spacing: 0.3px; }
        label { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; display: block; margin-top: 10px; margin-bottom: 4px; }

        input, select, textarea { 
            width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); 
            background: rgba(4, 7, 12, 0.8); color: var(--text-main); font-family: inherit; font-size: 0.85rem; transition: all 0.2s ease;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--border-glow); outline: none; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }

        button { 
            width: 100%; padding: 10px 16px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: 600; cursor: pointer; margin-top: 10px; transition: all 0.2s ease; font-family: inherit; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        button:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .pz-oauth-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255, 255, 255, 0.12); color: var(--text-main); box-shadow: none; }
        .pz-oauth-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--danger); }

        .pz-header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface); padding: 10px 16px; border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .nav-btn {
            width: auto !important; padding: 8px 10px !important; font-size: 0.75rem !important; margin: 0 !important;
            background: rgba(255,255,255,0.04) !important; border: 1px solid var(--border) !important; box-shadow: none !important;
        }
        .nav-btn:hover { background: rgba(56, 189, 248, 0.1) !important; border-color: var(--neon) !important; }

        .pz-tab-content { display: none; flex-direction: column; gap: 12px; animation: fadeIn 0.3s ease; }
        .pz-tab-content.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .chat-container {
            height: 200px; overflow-y: auto; background: rgba(4, 7, 12, 0.75); border-radius: 10px; padding: 10px; margin-bottom: 6px; font-size: 0.82rem; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth;
        }

        .chat-msg {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); padding: 8px 10px; border-radius: 8px; display: flex; flex-direction: column; gap: 4px; position: relative; animation: popIn 0.2s ease;
        }
        .chat-msg.mention { border-color: var(--neon); background: rgba(56, 189, 248, 0.08); }

        @keyframes popIn { from { transform: scale(0.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .chat-msg-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--text-muted); }
        .chat-msg-user { font-weight: 600; color: var(--neon); }
        .chat-msg-text { color: var(--text-main); word-break: break-word; line-height: 1.35; }
        
        .chat-reactions { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
        .reaction-pill { background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 12px; padding: 2px 6px; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; gap: 3px; color: var(--text-main); }
        .reaction-pill:hover { background: rgba(56,189,248,0.15); border-color: var(--neon); }

        .typing-indicator { font-size: 0.7rem; color: var(--text-muted); font-style: italic; height: 16px; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

<div id="app">
    
    <!-- 1. PANTALLA DE ACCESO OAUTH -->
    <div id="login-screen" class="pz-card" style="text-align: center; padding: 24px 16px; margin-top: 40px; display: none;">
        <div style="font-size: 2.5rem; color: var(--neon); margin-bottom: 12px;"><i class="fa-solid fa-satellite-dish"></i></div>
        <h2>GeoVibe // Portal</h2>
        <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 20px;">Red unificada de entretenimiento sincronizado</p>
        <button class="pz-oauth-btn" onclick="initGoogleLogin()">
            <i class="fa-brands fa-google" style="color: var(--danger); font-size: 1rem;"></i> Continuar con Google
        </button>
        <button onclick="manualLoginPrompt()" style="background: rgba(56,189,248,0.1); border: 1px solid var(--border-glow); margin-top: 8px; font-size: 0.75rem;">
            <i class="fa-solid fa-user"></i> Entrar con Nombre Manual
        </button>
    </div>

    <!-- 2. CONFIGURACIÓN DE PERFIL INICIAL -->
    <div id="setup-screen" class="pz-card" style="display: none; margin-top: 20px;">
        <h2><i class="fa-solid fa-user-gear"></i> Configuración de Perfil</h2>
        <label>Nombre de Operador / Handle</label>
        <input type="text" id="setup-handle" placeholder="Ej: CyberDJ">
        <label>Rol Telemétrico</label>
        <select id="setup-role">
            <option value="🎧">🎧 Operador de Audio / DJ</option>
            <option value="🚀">🚀 Oficial de Campo</option>
            <option value="🔥">🔥 Nodo Raver / Producción</option>
            <option value="⚡">⚡ Ingeniero Cyberpunk</option>
        </select>
        <label>Biografía Corta</label>
        <textarea id="setup-bio" placeholder="Estado..." rows="2" style="resize: none;"></textarea>
        <button onclick="completeSetup()" style="background: var(--accent); margin-top: 14px;"><i class="fa-solid fa-check"></i> Finalizar y Reclamar Bono (100 ZC)</button>
    </div>

    <!-- 3. HUD PRINCIPAL -->
    <div id="main-hud" style="display:none; flex-direction: column; gap: 12px;">
        <div class="pz-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="header-avatar" style="font-size: 1.2rem; background: rgba(56,189,248,0.1); padding: 6px; border-radius: 8px;">🎧</span>
                <span id="header-username" style="font-weight: 600; font-size: 0.85rem;">Operador</span>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
                <div style="background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.3); padding: 4px 8px; border-radius: 8px; display: flex; align-items: center; gap: 5px;">
                    <i class="fa-solid fa-coins" style="color: var(--economy); font-size: 0.75rem;"></i>
                    <span id="header-wallet" style="font-weight: 700; font-size: 0.75rem; color: var(--economy);">0 ZC</span>
                </div>
                <button class="nav-btn" onclick="switchPzTab('rooms')" title="Salas"><i class="fa-solid fa-tower-broadcast"></i></button>
                <button class="nav-btn" onclick="switchPzTab('global-chat')" title="Chat Global"><i class="fa-solid fa-globe"></i></button>
                <button class="nav-btn" onclick="switchPzTab('economy')" title="Banco" style="color: var(--economy) !important;"><i class="fa-solid fa-wallet"></i></button>
                <button class="nav-btn" onclick="switchPzTab('profile')" title="Perfil"><i class="fa-solid fa-sliders"></i></button>
                <button class="nav-btn" onclick="logoutSession()" title="Cerrar Sesión" style="color: var(--danger) !important;"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>

        <!-- MÓDULO DE SALAS Y STREAMING -->
        <div id="pz-rooms" class="pz-tab-content active">
            <div class="pz-card" id="create-room-card">
                <h2><i class="fa-solid fa-circle-plus"></i> Desplegar Frecuencia</h2>
                <input type="text" id="new-room-name" placeholder="Nombre de la sala...">
                <label>Plataforma de Entretenimiento</label>
                <select id="new-room-platform">
                    <option value="youtube">▶️ YouTube (Video / Música)</option>
                    <option value="spotify">🟢 Spotify (Música / Podcast)</option>
                    <option value="netflix">🔴 Netflix (Películas / Series)</option>
                    <option value="custom">🌐 Enlace Web Libre / Otro</option>
                </select>
                <input type="text" id="new-room-media" placeholder="ID del video o URL completa...">
                <button onclick="createRoom()"><i class="fa-solid fa-bolt"></i> Inicializar Sala</button>
            </div>

            <!-- Panel de Sala Activa -->
            <div id="active-room-panel" class="pz-card" style="display:none; border-color: var(--accent);">
                <h2><i class="fa-solid fa-tower-broadcast" style="color: var(--accent);"></i> Sala: <span id="current-room-title" style="color:white;">Ninguna</span></h2>
                
                <div style="background: #000; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 10px;">
                    <div id="media-player-wrapper" style="width: 100%; height: 210px; display: flex; align-items: center; justify-content: center;">
                        <span style="font-size: 0.75rem; color: var(--text-muted);">Cargando contenido multimedia...</span>
                    </div>
                </div>

                <div id="room-chat-box" class="chat-container"></div>
                <div id="room-typing" class="typing-indicator"></div>
                
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="room-chat-input" placeholder="Escribe un mensaje o usa @nombre..." style="margin:0;" oninput="handleTypingInput('room')">
                    <button onclick="sendRoomMessage()" style="width: auto; margin:0; padding: 0 14px;"><i class="fa-solid fa-paper-plane"></i></button>
                </div>

                <button onclick="leaveRoom()" style="background: var(--danger); margin-top: 10px;">
                    <i class="fa-solid fa-power-off"></i> Desconectarse de la Sala
                </button>
            </div>
        </div>

        <!-- MÓDULO DE CHAT GLOBAL -->
        <div id="pz-global-chat" class="pz-tab-content">
            <div class="pz-card">
                <h2><i class="fa-solid fa-globe"></i> Canal de Enlace Global</h2>
                <div id="global-chat-box" class="chat-container" style="height: 220px;"></div>
                <div id="global-typing" class="typing-indicator"></div>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="global-chat-input" placeholder="Transmitir mensaje global..." style="margin:0;" oninput="handleTypingInput('global')">
                    <button onclick="sendGlobalMessage()" style="width: auto; margin:0; padding: 0 14px;"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- MÓDULO DE BILLETERA -->
        <div id="pz-economy" class="pz-tab-content">
            <div class="pz-card" style="border-color: var(--economy);">
                <h2><i class="fa-solid fa-vault" style="color: var(--economy);"></i> Billetera Virtual Z-Coins</h2>
                <div style="background: rgba(245,158,11,0.06); border: 1px solid rgba(245,158,11,0.2); border-radius: 12px; padding: 16px; text-align: center; margin-bottom: 12px;">
                    <span style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Balance Disponible</span>
                    <div id="economy-balance-display" style="font-size: 2rem; font-weight: 700; color: var(--economy); margin: 4px 0;">0 ZC</div>
                </div>
                <button onclick="claimDailyReward()" style="background: var(--accent);"><i class="fa-solid fa-gift"></i> Reclamar Bono Diario (+10 ZC)</button>
                <button onclick="alert('Conectando con pasarela de pago Stripe...')" style="background: var(--primary);"><i class="fa-solid fa-cart-shopping"></i> Comprar Z-Coins</button>
            </div>
        </div>

        <!-- MÓDULO DE PERFIL -->
        <div id="pz-profile" class="pz-tab-content">
            <div class="pz-card">
                <h2><i class="fa-solid fa-sliders"></i> Perfil del Operador</h2>
                <label>Nombre de usuario</label>
                <input type="text" id="profile-handle">
                <label>Biografía corta</label>
                <textarea id="profile-bio" rows="3" style="resize: none;"></textarea>
                <button onclick="saveProfileChanges()" style="margin-top: 14px;"><i class="fa-solid fa-floppy-disk"></i> Guardar Cambios</button>
            </div>
        </div>
    </div>

</div>

<script>
    const socket = io(window.location.origin, { transports: ['websocket', 'polling'] });

    let userProfile = { name: '', role: '🎧', bio: '', wallet: 0 };
    let currentRoom = null;
    let typingTimer = null;

    window.addEventListener('DOMContentLoaded', () => {
        const savedUser = localStorage.getItem('geovibe_user');
        if (savedUser) {
            try {
                userProfile = JSON.parse(savedUser);
                if (userProfile && userProfile.name) {
                    loadMainHud();
                    return;
                }
            } catch(e) {
                localStorage.removeItem('geovibe_user');
            }
        }
        document.getElementById('login-screen').style.display = 'block';
    });

    function manualLoginPrompt() {
        let manualName = prompt("Ingresa tu nombre de operador:");
        if (manualName && manualName.trim() !== '') {
            userProfile.name = manualName.trim();
            document.getElementById('setup-handle').value = userProfile.name;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
        }
    }

    function initGoogleLogin() {
        if (typeof google === 'undefined' || !google.accounts) {
            manualLoginPrompt();
            return;
        }

        google.accounts.id.initialize({
            client_id: "217257383894-svk08tdkru8n294ouema10flce0tbric.apps.googleusercontent.com",
            callback: handleGoogleAuthResponse
        });
        google.accounts.id.prompt((notification) => {
            if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                manualLoginPrompt();
            }
        });
    }

    async function handleGoogleAuthResponse(response) {
        try {
            const res = await fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: response.credential })
            });
            const data = await res.json();
            if (data.success) {
                userProfile.name = data.user.name;
                document.getElementById('setup-handle').value = data.user.name;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'block';
            }
        } catch (err) {
            userProfile.name = "Operador " + Math.floor(Math.random() * 900 + 100);
            document.getElementById('setup-handle').value = userProfile.name;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
        }
    }

    function completeSetup() {
        const handle = document.getElementById('setup-handle').value.trim();
        if (!handle) { alert('Por favor ingresa un nombre de operador.'); return; }
        userProfile.name = handle;
        userProfile.role = document.getElementById('setup-role').value;
        userProfile.bio = document.getElementById('setup-bio').value;
        if (!userProfile.wallet) userProfile.wallet = 100;
        
        localStorage.setItem('geovibe_user', JSON.stringify(userProfile));
        loadMainHud();
    }

    function loadMainHud() {
        document.getElementById('header-username').innerText = userProfile.name;
        document.getElementById('header-avatar').innerText = userProfile.role || '🎧';
        document.getElementById('profile-handle').value = userProfile.name;
        document.getElementById('profile-bio').value = userProfile.bio || '';
        updateWalletUI();

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('main-hud').style.display = 'flex';
    }

    function logoutSession() {
        if (confirm('¿Deseas cerrar sesión y cambiar de cuenta?')) {
            localStorage.removeItem('geovibe_user');
            location.reload();
        }
    }

    function updateWalletUI() {
        document.getElementById('header-wallet').innerText = `${userProfile.wallet} ZC`;
        document.getElementById('economy-balance-display').innerText = `${userProfile.wallet} ZC`;
        localStorage.setItem('geovibe_user', JSON.stringify(userProfile));
    }

    function claimDailyReward() {
        userProfile.wallet += 10;
        updateWalletUI();
        alert('¡Bono diario reclamado (+10 ZC)!');
    }

    function createRoom() {
        const name = document.getElementById('new-room-name').value;
        const platform = document.getElementById('new-room-platform').value;
        const mediaInput = document.getElementById('new-room-media').value.trim();
        if (!name) { alert('Ingresa una designación para la sala.'); return; }
        socket.emit('create_room', { roomName: name, platform, mediaInput, user: userProfile.name });
    }

    socket.on('room_joined', (data) => {
        currentRoom = data.roomName;
        document.getElementById('current-room-title').innerText = data.roomName;
        renderEmbedPlayer(data.platform, data.mediaInput);
        document.getElementById('create-room-card').style.display = 'none';
        document.getElementById('active-room-panel').style.display = 'block';
        document.getElementById('new-room-name').value = '';
        document.getElementById('new-room-media').value = '';
        switchPzTab('rooms');
    });

    function renderEmbedPlayer(platform, input) {
        const wrapper = document.getElementById('media-player-wrapper');
        wrapper.innerHTML = '';
        if (!input) { wrapper.innerHTML = `<span style="font-size: 0.75rem; color: var(--text-muted);">Sin contenido multimedia</span>`; return; }

        let embedHtml = '';
        if (platform === 'youtube') {
            let videoId = input;
            if (input.includes('watch?v=')) videoId = input.split('watch?v=')[1].split('&')[0];
            else if (input.includes('youtu.be/')) videoId = input.split('youtu.be/')[1].split('?')[0];
            embedHtml = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        } else if (platform === 'spotify') {
            let spotifyUri = input;
            if (input.includes('spotify.com/')) spotifyUri = input.replace('spotify.com/', 'spotify.com/embed/');
            embedHtml = `<iframe src="${spotifyUri}" width="100%" height="100%" frameborder="0" allowtransparency="true" allow="encrypted-media"></iframe>`;
        } else if (platform === 'netflix') {
            embedHtml = `<div style="padding: 24px; text-align: center;"><i class="fa-solid fa-film" style="font-size: 2.2rem; color: var(--danger); margin-bottom: 10px;"></i><p style="font-size: 0.8rem; color: white; margin-bottom: 12px;">Transmisión externa (Netflix)</p><a href="${input}" target="_blank" style="background: var(--danger); color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 0.75rem; display:inline-block; font-weight: 600;">Abrir enlace <i class="fa-solid fa-external-link"></i></a></div>`;
        } else {
            embedHtml = `<iframe src="${input}" width="100%" height="100%" frameborder="0"></iframe>`;
        }
        wrapper.innerHTML = embedHtml;
    }

    function handleTypingInput(scope) {
        socket.emit('typing', { scope, roomName: currentRoom, user: userProfile.name });
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
            socket.emit('stop_typing', { scope, roomName: currentRoom, user: userProfile.name });
        }, 1200);
    }

    function sendRoomMessage() {
        const input = document.getElementById('room-chat-input');
        const text = input.value.trim();
        if (!text || !currentRoom) return;
        socket.emit('room_message', { roomName: currentRoom, user: userProfile.name, text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
        input.value = '';
        socket.emit('stop_typing', { scope: 'room', roomName: currentRoom, user: userProfile.name });
    }

    function sendGlobalMessage() {
        const input = document.getElementById('global-chat-input');
        const text = input.value.trim();
        if (!text) return;
        socket.emit('chat_message', { user: userProfile.name, text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
        input.value = '';
        socket.emit('stop_typing', { scope: 'global', user: userProfile.name });
    }

    socket.on('room_message', (data) => appendMessage('room-chat-box', data));
    socket.on('chat_message', (data) => appendMessage('global-chat-box', data));

    function appendMessage(containerId, data) {
        const chatBox = document.getElementById(containerId);
        const msgId = 'msg-' + Math.random().toString(36).substr(2, 9);
        
        const isMentioned = data.text.includes(`@${userProfile.name}`);
        const msgDiv = document.createElement('div');
        msgDiv.className = `chat-msg ${isMentioned ? 'mention' : ''}`;
        msgDiv.id = msgId;

        msgDiv.innerHTML = `
            <div class="chat-msg-header">
                <span class="chat-msg-user">${data.user}</span>
                <span>${data.time || ''}</span>
            </div>
            <div class="chat-msg-text">${escapeHtml(data.text)}</div>
            <div class="chat-reactions" id="reactions-${msgId}">
                <button class="reaction-pill" onclick="addReaction('${containerId}', '${msgId}', '🔥')">🔥 <span>0</span></button>
                <button class="reaction-pill" onclick="addReaction('${containerId}', '${msgId}', '🚀')">🚀 <span>0</span></button>
                <button class="reaction-pill" onclick="addReaction('${containerId}', '${msgId}', '❤️')">❤️ <span>0</span></button>
            </div>
        `;

        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addReaction(containerId, msgId, emoji) {
        const msgElement = document.getElementById(msgId);
        if(!msgElement) return;
        const pills = msgElement.querySelectorAll('.reaction-pill');
        pills.forEach(pill => {
            if(pill.innerText.includes(emoji)) {
                const countSpan = pill.querySelector('span');
                countSpan.innerText = parseInt(countSpan.innerText) + 1;
                pill.style.borderColor = 'var(--neon)';
            }
        });
    }

    socket.on('display_typing', (data) => {
        const indicator = document.getElementById(data.scope === 'room' ? 'room-typing' : 'global-typing');
        if (indicator) {
            indicator.innerHTML = `<i class="fa-solid fa-pen-clip"></i> ${data.user} está escribiendo...`;
        }
    });

    socket.on('clear_typing', (data) => {
        const indicator = document.getElementById(data.scope === 'room' ? 'room-typing' : 'global-typing');
        if (indicator) indicator.innerHTML = '';
    });

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function leaveRoom() {
        currentRoom = null;
        document.getElementById('active-room-panel').style.display = 'none';
        document.getElementById('create-room-card').style.display = 'block';
        document.getElementById('room-chat-box').innerHTML = '';
        document.getElementById('media-player-wrapper').innerHTML = '';
    }

    function saveProfileChanges() {
        userProfile.name = document.getElementById('profile-handle').value;
        userProfile.bio = document.getElementById('profile-bio').value;
        localStorage.setItem('geovibe_user', JSON.stringify(userProfile));
        document.getElementById('header-username').innerText = userProfile.name;
        alert('Perfil actualizado correctamente.');
    }

    function switchPzTab(tabId) {
        document.querySelectorAll('.pz-tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById(`pz-${tabId}`).classList.add('active');
    }
</script>

</body>
</html>
