<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoVibe | Project Z HUD Edition</title>
    <!-- Librerías Externas -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --primary: #6366f1; 
            --secondary: #a855f7;
            --accent: #10b981;
            --bg-dark: #05050a;
            --panel-bg: rgba(15, 15, 25, 0.75);
            --border-glow: rgba(99, 102, 241, 0.25);
        }

        body { 
            background: var(--bg-dark); color: #e2e8f0; font-family: 'Outfit', sans-serif; 
            margin: 0; padding: 10px; display: flex; justify-content: center; 
            min-height: 100vh; overflow-x: hidden;
        }

        #app { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; }

        /* Tarjetas estilo HUD / Project Z */
        .hud-card { 
            background: var(--panel-bg); backdrop-filter: blur(20px); 
            border: 1px solid var(--border-glow); padding: 14px; 
            border-radius: 18px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            position: relative;
        }

        h2, h3 { margin: 0 0 8px 0; font-weight: 900; letter-spacing: -0.5px; }
        h2 { font-size: 1.4rem; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        input, select, textarea { 
            width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(0,0,0,0.6); color: white; box-sizing: border-box; margin: 4px 0; font-family: inherit;
            font-size: 0.9rem; transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; }

        button { 
            width: 100%; padding: 10px; border-radius: 10px; border: none; 
            background: var(--primary); color: white; font-weight: 700; cursor: pointer; 
            margin-top: 4px; transition: all 0.2s; font-family: inherit; font-size: 0.9rem;
        }
        button:hover { filter: brightness(1.2); box-shadow: 0 0 15px rgba(99,102,241,0.5); }

        /* Barra superior HUD */
        .hud-header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--panel-bg); padding: 10px 15px; border-radius: 14px;
            border: 1px solid var(--border-glow);
        }

        /* Mapa y Contenedores compactos */
        #map { height: 130px; border-radius: 12px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); }

        .list-item {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px; padding: 8px 12px; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 6px; font-size: 0.85rem;
        }
        .list-item button { width: auto; padding: 4px 10px; font-size: 0.75rem; margin: 0; }

        /* Chat estilo flujo continuo */
        #chat-box { height: 220px; overflow-y: auto; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
        .msg-bubble { 
            background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 12px; 
            border-left: 3px solid var(--primary); font-size: 0.9rem;
        }
        .msg-header { display: flex; justify-content: space-between; font-size: 0.7rem; opacity: 0.6; margin-bottom: 2px; }
        .typing-indicator { font-size: 0.7rem; color: var(--secondary); height: 14px; font-style: italic; }

        .reactions-bar { display: flex; gap: 4px; margin-top: 4px; }
        .reaction-btn { background: rgba(255,255,255,0.06); border: none; border-radius: 6px; padding: 2px 6px; cursor: pointer; color: white; width: auto; font-size: 0.75rem; }

        .badge { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--accent); color: var(--accent); padding: 1px 6px; border-radius: 10px; font-size: 0.65rem; font-weight: 700; }
        
        /* Sistema de pestañas HUD compactas */
        .hud-tab-content { display: none; }
        .hud-tab-content.active { display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

<div id="app">
    
    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="hud-card" style="margin-top: 40px; text-align: center; padding: 30px 20px;">
        <h2 style="font-size: 2rem; margin-bottom: 5px;">GeoVibe 🌍</h2>
        <p style="opacity: 0.6; font-size: 0.85rem; margin-bottom: 20px;">Project Z HUD Experience</p>
        <input type="text" id="login-user" placeholder="Nombre de usuario...">
        <input type="password" id="login-pass" placeholder="Contraseña...">
        <select id="login-avatar">
            <option value="🎧">🎧 DJ / Productor</option>
            <option value="🚀">🚀 Explorador</option>
            <option value="🔥">🔥 Raver</option>
            <option value="⚡">⚡ Cyberpunk</option>
        </select>
        <button onclick="login()" style="margin-top: 10px; padding: 12px;">Conectar al Sistema</button>
    </div>

    <!-- PANEL PRINCIPAL HUD -->
    <div id="main-hud" style="display:none; flex-direction: column; gap: 10px;">
        
        <!-- BARRA DE ESTADO SUPERIOR -->
        <div class="hud-header">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span id="header-avatar" style="font-size: 1.2rem;">🎧</span>
                <div>
                    <span id="header-username" style="font-weight: 700; font-size: 0.9rem; display: block;">Usuario</span>
                    <span style="font-size: 0.65rem; opacity: 0.5;" id="header-status">Desconectado del Radar</span>
                </div>
            </div>
            <div style="display: flex; gap: 5px;">
                <button onclick="switchHudTab('rooms')" style="width: auto; padding: 6px 10px; font-size: 0.75rem; background:rgba(255,255,255,0.1); margin:0;"><i class="fa-solid fa-tower-broadcast"></i> Salas</button>
                <button onclick="switchHudTab('profile')" style="width: auto; padding: 6px 10px; font-size: 0.75rem; background:rgba(255,255,255,0.1); margin:0;"><i class="fa-solid fa-user"></i> Perfil</button>
            </div>
        </div>

        <!-- VISTA 1: SALAS Y EXPLORACIÓN -->
        <div id="hud-rooms" class="hud-tab-content active">
            <div class="hud-card">
                <h2><i class="fa-solid fa-crosshairs"></i> Estado del Radar GPS</h2>
                <button id="btn-init" style="background:#1e293b; color:var(--accent); border: 1px solid var(--accent);" onclick="initRadar()">Activar Ubicación GPS</button>
            </div>

            <div class="hud-card">
                <h2><i class="fa-solid fa-circle-plus"></i> Crear Sala Musical</h2>
                <input type="text" id="new-room-name" placeholder="Nombre (ej: Cyberpunk Lobby)">
                <input type="text" id="new-room-song" placeholder="ID Spotify...">
                <button onclick="createRoom()"><i class="fa-solid fa-music"></i> Inicializar Sala</button>
            </div>

            <div class="hud-card">
                <h2><i class="fa-solid fa-signal"></i> Frecuencias Activas</h2>
                <div id="rooms-container" style="max-height: 180px; overflow-y: auto;">
                    <p style="opacity: 0.5; font-size: 0.8rem; text-align: center;">Escaneando redes...</p>
                </div>
            </div>
        </div>

        <!-- VISTA 2: INTERFAZ DE SALA ACTIVA (ESTILO PROJECT Z CHAT & HUD) -->
        <div id="hud-room-active" class="hud-tab-content">
            
            <!-- CONTENEDOR SUPERIOR: MAPA Y MÚSICA COMPACTOS -->
            <div class="hud-card" style="padding: 10px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <span id="active-room-name" style="font-weight: 900; font-size: 0.95rem; color: var(--secondary);">Sala</span>
                    <button onclick="leaveRoom()" style="width: auto; padding: 3px 8px; background: #f43f5e; font-size: 0.65rem; margin:0;">Abandonar</button>
                </div>
                <div id="map"></div>
                <iframe id="spotify-player" src="" width="100%" height="65" frameborder="0" style="border-radius: 8px; margin-bottom: 6px;"></iframe>
                <div style="display: flex; gap: 4px;">
                    <input type="text" id="song-input" placeholder="Añadir ID Spotify..." style="margin:0; padding: 6px 10px; font-size: 0.8rem;">
                    <button onclick="addSong()" style="background:#1db954; width:70px; margin:0; padding:6px; font-size:0.75rem;">Añadir</button>
                    <button onclick="skipSong()" style="background:#f59e0b; color:#000; width:70px; margin:0; padding:6px; font-size:0.75rem;">Saltar</button>
                </div>
            </div>

            <!-- PANEL CENTRAL: CHAT Y USUARIOS EN LÍNEA -->
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px;">
                <!-- Chat Principal -->
                <div class="hud-card" style="padding: 10px; display:flex; flex-direction:column; justify-content:space-between;">
                    <div id="chat-box"></div>
                    <div>
                        <div id="typing-box" class="typing-indicator"></div>
                        <div style="display: flex; gap: 4px;">
                            <input type="text" id="msg-input" placeholder="Mensaje..." style="margin:0; padding:8px; font-size:0.8rem;" oninput="handleTyping()" onkeypress="if(event.key==='Enter') sendMsg()">
                            <button onclick="sendMsg()" style="width: 40px; margin:0; padding:8px;"><i class="fa-solid fa-paper-plane"></i></button>
                            <button id="mic-btn" onclick="toggleMic()" style="width: 40px; background:var(--secondary); margin:0; padding:8px;" title="Voz"><i class="fa-solid fa-microphone"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Lista de Usuarios Conectados (Sidebar Project Z style) -->
                <div class="hud-card" style="padding: 10px; display:flex; flex-direction:column;">
                    <span style="font-size: 0.75rem; font-weight: 700; opacity: 0.7; margin-bottom: 6px;"><i class="fa-solid fa-users"></i> Online</span>
                    <div id="room-members-list" style="max-height: 200px; overflow-y: auto; display:flex; flex-direction:column; gap:4px;">
                        <span style="font-size: 0.7rem; opacity: 0.4;">Cargando...</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- VISTA 3: PERFIL DE USUARIO -->
        <div id="hud-profile" class="hud-tab-content">
            <div class="hud-card" style="text-align: center; padding: 20px;">
                <div id="profile-avatar-big" style="font-size: 2.5rem; margin-bottom: 5px;">🎧</div>
                <h3 id="profile-name-big" style="margin-bottom: 2px;">Usuario</h3>
                <p style="font-size: 0.75rem; opacity: 0.6; margin-bottom: 15px;">Configuración de Enlace</p>
                
                <div style="text-align: left;">
                    <label style="font-size: 0.7rem; opacity: 0.7;">Biografía / Frase:</label>
                    <textarea id="profile-bio" rows="2" placeholder="Tu estado actual..."></textarea>
                    
                    <label style="font-size: 0.7rem; opacity: 0.7; margin-top: 6px; display: block;">Estilo Musical:</label>
                    <input type="text" id="profile-genre" placeholder="Ej: Techno, Cyberpunk...">
                </div>
                <button onclick="saveProfile()" style="background:var(--accent); margin-top: 12px;">Guardar Cambios</button>
            </div>
        </div>

    </div>
</div>

<!-- MODAL DE CHAT PRIVADO (DM) -->
<div id="dm-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); z-index:2000; justify-content:center; align-items:center;">
    <div class="hud-card" style="width: 85%; max-width: 350px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span id="dm-target-title" style="font-weight: 700; font-size: 0.9rem;">Chat Privado</span>
            <button onclick="closeDmModal()" style="width:auto; padding:2px 8px; background:#f43f5e; font-size:0.65rem; margin:0;">X</button>
        </div>
        <div id="dm-box" style="height: 130px; overflow-y: auto; background:rgba(0,0,0,0.5); border-radius:8px; padding:8px; margin-bottom:8px; font-size:0.8rem;"></div>
        <input type="text" id="dm-input" placeholder="Escribir mensaje..." style="margin:0; padding:8px; font-size:0.8rem;" onkeypress="if(event.key==='Enter') sendDm()">
        <button onclick="sendDm()" style="padding:8px; font-size:0.8rem;">Enviar</button>
    </div>
</div>

<script>
    const socket = io("https://chat-online-110g.onrender.com");
    let currentRoomId = null;
    let myProfile = null;
    let map = null;
    let markers = [];
    let mediaRecorder, audioChunks = [];
    let typingTimeout = null;
    let currentTargetDmUser = null;

    function switchHudTab(tabName) {
        document.querySelectorAll('.hud-tab-content').forEach(el => el.classList.remove('active'));
        if(tabName === 'rooms') document.getElementById('hud-rooms').classList.add('active');
        if(tabName === 'room-active') document.getElementById('hud-room-active').classList.add('active');
        if(tabName === 'profile') document.getElementById('hud-profile').classList.add('active');
    }

    function login() {
        const username = document.getElementById('login-user').value.trim();
        const password = document.getElementById('login-pass').value.trim();
        const avatar = document.getElementById('login-avatar').value;
        if (!username || !password) return alert('Rellena los campos.');
        socket.emit('login_user', { username, password, avatar });
    }

    socket.on('login_success', (profile) => {
        myProfile = profile;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-hud').style.display = 'flex';
        document.getElementById('header-avatar').innerText = myProfile.avatar;
        document.getElementById('header-username').innerText = myProfile.username;
        document.getElementById('profile-name-big').innerText = `${myProfile.avatar} ${myProfile.username}`;
        document.getElementById('profile-avatar-big').innerText = myProfile.avatar;
        document.getElementById('profile-bio').value = profile.bio || '';
        document.getElementById('profile-genre').value = profile.genre || '';
    });

    socket.on('login_error', (err) => alert(err));

    function saveProfile() {
        const bio = document.getElementById('profile-bio').value.trim();
        const genre = document.getElementById('profile-genre').value.trim();
        socket.emit('update_profile', { username: myProfile.username, bio, genre });
        myProfile.bio = bio;
        myProfile.genre = genre;
        alert('Perfil actualizado con éxito');
    }

    function initRadar() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                socket.emit('update_location', { 
                    lat: pos.coords.latitude, 
                    lng: pos.coords.longitude, 
                    username: `${myProfile.avatar} ${myProfile.username}` 
                });
                document.getElementById('btn-init').innerText = "✓ Radar Activo";
                document.getElementById('btn-init').style.background = "#064e3b";
                document.getElementById('header-status').innerText = "GPS En línea";
            }, () => {
                alert('GPS denegado.');
                socket.emit('update_location', { lat: null, lng: null, username: `${myProfile.avatar} ${myProfile.username}` });
            });
        }
    }

    socket.on('rooms_list', (rooms) => {
        const container = document.getElementById('rooms-container');
        if (!rooms || rooms.length === 0) {
            container.innerHTML = '<p style="opacity: 0.5; font-size: 0.8rem; text-align: center;">No hay salas.</p>';
            return;
        }
        container.innerHTML = rooms.map(r => `
            <div class="list-item">
                <div>
                    <span style="font-weight:700;">${r.name}</span>
                    <div style="font-size:0.65rem; opacity:0.5;">${r.count} conectados</div>
                </div>
                <button onclick="joinRoom('${r.id}')">Entrar</button>
            </div>
        `).join('');
    });

    function createRoom() {
        const name = document.getElementById('new-room-name').value.trim() || 'Sala Vibe';
        let trackUri = document.getElementById('new-room-song').value.trim() || '4cOdK2wGLETKBW3PvgPWqT';
        if(trackUri.includes('spotify.com')) trackUri = trackUri.split('/').pop().split('?')[0];
        socket.emit('create_room', { name, trackUri });
    }

    function joinRoom(roomId) {
        socket.emit('join_room', roomId);
    }

    socket.on('room_joined', (room) => {
        currentRoomId = room.id;
        document.getElementById('active-room-name').innerText = room.name;
        switchHudTab('room-active');

        const cleanUri = (room.currentTrack || '4cOdK2wGLETKBW3PvgPWqT').replace('spotify:track:', '');
        document.getElementById('spotify-player').src = `https://open.spotify.com/embed/track/${cleanUri}?utm_source=generator&theme=0`;

        setTimeout(() => {
            if (!map) {
                map = L.map('map').setView([6.217, -75.567], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            } else {
                map.invalidateSize();
            }
        }, 300);
    });

    function leaveRoom() {
        switchHudTab('rooms');
        location.reload();
    }

    socket.on('update_members_map', (members) => {
        if (!map) return;
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        
        const membersContainer = document.getElementById('room-members-list');
        membersContainer.innerHTML = members.map(m => `
            <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.3); padding:4px 8px; border-radius:6px;">
                <span style="font-size:0.75rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:85px;">${m.username}</span>
                ${m.username !== `${myProfile.avatar} ${myProfile.username}` ? `<button onclick="openDmModal('${m.username}')" style="width:auto; padding:2px 6px; font-size:0.6rem; margin:0; background:var(--primary);">DM</button>` : '<span class="badge">Tú</span>'}
            </div>
        `).join('');

        members.forEach(m => {
            if (m.lat && m.lng) {
                const marker = L.marker([m.lat, m.lng]).addTo(map).bindPopup(m.username);
                markers.push(marker);
            }
        });
    });

    function openDmModal(username) {
        currentTargetDmUser = username;
        document.getElementById('dm-target-title').innerText = `DM: ${username}`;
        document.getElementById('dm-box').innerHTML = '';
        document.getElementById('dm-modal').style.display = 'flex';
    }

    function closeDmModal() {
        document.getElementById('dm-modal').style.display = 'none';
    }

    function sendDm() {
        const msg = document.getElementById('dm-input').value.trim();
        if(!msg) return;
        socket.emit('private_msg', { targetUser: currentTargetDmUser, msg });
        document.getElementById('dm-box').innerHTML += `<div style="text-align:right; margin:3px 0;"><span style="background:var(--primary); padding:3px 6px; border-radius:6px; display:inline-block;">Tú: ${msg}</span></div>`;
        document.getElementById('dm-input').value = '';
    }

    socket.on('incoming_dm', (data) => {
        if(document.getElementById('dm-modal').style.display !== 'flex' || currentTargetDmUser !== data.from) {
            openDmModal(data.from);
        }
        document.getElementById('dm-box').innerHTML += `<div style="text-align:left; margin:3px 0;"><span style="background:rgba(255,255,255,0.1); padding:3px 6px; border-radius:6px; display:inline-block;">${data.from}: ${data.msg}</span></div>`;
    });

    function addSong() {
        let input = document.getElementById('song-input').value.trim();
        if (!input) return;
        if(input.includes('spotify.com')) input = input.split('/').pop().split('?')[0];
        socket.emit('add_song', { roomId: currentRoomId, uri: input });
        document.getElementById('song-input').value = '';
    }

    function skipSong() { socket.emit('skip_song', currentRoomId); }

    socket.on('play_now', (uri) => {
        const cleanUri = uri.replace('spotify:track:', '');
        document.getElementById('spotify-player').src = `https://open.spotify.com/embed/track/${cleanUri}?utm_source=generator&theme=0`;
    });

    function sendMsg() {
        const msg = document.getElementById('msg-input').value.trim();
        if (!msg) return;
        socket.emit('chat_msg', { roomId: currentRoomId, msg, user: `${myProfile.avatar} ${myProfile.username}` });
        document.getElementById('msg-input').value = '';
        socket.emit('typing', { roomId: currentRoomId, user: myProfile.username, isTyping: false });
    }

    function handleTyping() {
        socket.emit('typing', { roomId: currentRoomId, user: myProfile.username, isTyping: true });
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            socket.emit('typing', { roomId: currentRoomId, user: myProfile.username, isTyping: false });
        }, 1500);
    }

    socket.on('display_typing', (data) => {
        document.getElementById('typing-box').innerText = data.isTyping ? `✏️ ${data.user} escribiendo...` : "";
    });

    function react(msgId, emoji) { socket.emit('react_msg', { roomId: currentRoomId, msgId, emoji }); }

    socket.on('msg_reacted', (data) => {
        const el = document.getElementById(`reactions-${data.msgId}`);
        if(el) el.innerHTML += `<span style="background:rgba(255,255,255,0.15); padding:2px 5px; border-radius:4px; font-size:0.7rem;">${data.emoji}</span>`;
    });

    socket.on('new_msg', (data) => {
        const box = document.getElementById('chat-box');
        box.innerHTML += `
            <div class="msg-bubble">
                <div class="msg-header"><span><b>${data.user}</b></span><span>${data.time}</span></div>
                <div style="font-size:0.6rem; opacity:0.5; margin-bottom:2px;">📍 ${data.distance}</div>
                <div style="word-break: break-word;">${data.msg}</div>
                <div class="reactions-bar" id="reactions-${data.id}">
                    <button class="reaction-btn" onclick="react('${data.id}', '🔥')">🔥</button>
                    <button class="reaction-btn" onclick="react('${data.id}', '❤️')">❤️</button>
                    <button class="reaction-btn" onclick="react('${data.id}', '🎵')">🎵</button>
                </div>
            </div>
        `;
        box.scrollTop = box.scrollHeight;
    });

    async function toggleMic() {
        const micBtn = document.getElementById('mic-btn');
        if (!mediaRecorder || mediaRecorder.state === 'inactive') {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.start();
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    socket.emit('send_voice', { roomId: currentRoomId, audioBlob: blob });
                };
                micBtn.style.background = "#ef4444";
                micBtn.innerHTML = '<i class="fa-solid fa-stop"></i>';
            } catch (e) { alert('Micrófono denegado.'); }
        } else {
            mediaRecorder.stop();
            micBtn.style.background = "var(--secondary)";
            micBtn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
        }
    }

    socket.on('incoming_voice', (data) => {
        const url = URL.createObjectURL(new Blob([data.audioBlob], { type: 'audio/webm' }));
        const box = document.getElementById('chat-box');
        box.innerHTML += `
            <div class="msg-bubble">
                <div class="msg-header"><span>🔊 Voz de ${data.from}</span></div>
                <audio src="${url}" controls style="width:100%; height:26px; margin-top:3px;"></audio>
            </div>
        `;
        box.scrollTop = box.scrollHeight;
    });
</script>
</body>
</html>
