<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoVibe | Project Z Ultimate Enterprise Hub</title>
    <!-- Librerías Externas -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root { 
            --pz-bg: #04060a;
            --pz-surface: #0b0f17;
            --pz-surface-glass: rgba(11, 15, 23, 0.92);
            --pz-border: #1a2336;
            --pz-border-glow: #25334d;
            --pz-primary: #2563eb;
            --pz-primary-glow: rgba(37, 99, 235, 0.4);
            --pz-accent: #059669;
            --pz-neon: #06b6d4;
            --pz-neon-glow: rgba(6, 182, 212, 0.25);
            --pz-pink: #db2777;
            --pz-amber: #d97706;
            --pz-netflix: #e50914;
            --pz-sales: #8b5cf6; 
            --pz-economy: #eab308;
            --pz-google: #ea4335;
            --pz-facebook: #1877f2;
            --pz-instagram: #e1306c;
            --pz-text: #f8fafc;
            --pz-muted: #64748b;
            --pz-danger: #dc2626;
        }

        * { box-sizing: border-box; }

        body { 
            background: var(--pz-bg); color: var(--pz-text); font-family: 'Outfit', sans-serif; 
            margin: 0; padding: 4px; display: flex; justify-content: center; 
            min-height: 100vh; overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(37, 99, 235, 0.03) 0%, transparent 40%);
        }

        #app { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 6px; }

        .pz-card { 
            background: var(--pz-surface-glass); backdrop-filter: blur(24px); 
            border: 1px solid var(--pz-border); padding: 12px; 
            border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            position: relative; overflow: hidden;
            transition: border-color 0.3s ease;
        }
        .pz-card:hover { border-color: var(--pz-border-glow); }
        
        .pz-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
            background: var(--pz-neon); box-shadow: 0 0 10px var(--pz-neon);
            border-top-left-radius: 12px; border-bottom-left-radius: 12px;
        }

        h2, h3 { margin: 0 0 8px 0; font-weight: 700; letter-spacing: -0.3px; }
        h2 { font-size: 1.05rem; color: var(--pz-neon); display: flex; align-items: center; gap: 8px; }

        label { font-size: 0.65rem; color: var(--pz-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-top: 6px; }

        input, select, textarea { 
            width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--pz-border); 
            background: rgba(2, 4, 8, 0.7); color: white; box-sizing: border-box; margin: 4px 0; font-family: inherit;
            font-size: 0.8rem; transition: all 0.25s ease;
        }
        input:focus, select:focus, textarea:focus { 
            border-color: var(--pz-neon); outline: none; 
            box-shadow: 0 0 12px var(--pz-neon-glow); 
            background: rgba(4, 8, 16, 0.9);
        }

        button { 
            width: 100%; padding: 8px 12px; border-radius: 8px; border: none; 
            background: var(--pz-primary); color: white; font-weight: 600; cursor: pointer; 
            margin-top: 4px; transition: all 0.25s ease; font-family: inherit; font-size: 0.8rem;
            box-shadow: 0 4px 12px var(--pz-primary-glow);
        }
        button:hover { filter: brightness(1.15); transform: translateY(-1px); box-shadow: 0 6px 16px var(--pz-primary-glow); }

        .pz-header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--pz-surface); padding: 8px 12px; border-radius: 10px;
            border: 1px solid var(--pz-border); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .auth-switch-link {
            text-align: center; margin-top: 8px; font-size: 0.7rem; color: var(--pz-muted);
        }
        .auth-switch-link span { color: var(--pz-neon); cursor: pointer; font-weight: 700; text-decoration: underline; }

        .pz-tab-content { display: none; flex-direction: column; gap: 8px; animation: fadeIn 0.3s ease; }
        .pz-tab-content.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div id="app">
    
    <!-- MÓDULO DE AUTENTICACIÓN AMPLIADO -->
    <div id="login-screen" class="pz-card" style="margin-top: 15px; text-align: center; padding: 16px;">
        <h2><i class="fa-solid fa-shield-halved"></i> GeoVibe // Core Security</h2>
        <p id="auth-subtitle" style="color: var(--pz-muted); font-size: 0.75rem; margin-bottom: 10px;">Inicia sesión o crea tu nodo de acceso</p>
        
        <!-- Campos de Registro Ampliados -->
        <div id="registration-form" style="display: none; text-align: left;">
            <input type="text" id="reg-username" placeholder="Nombre de Operador (Handle)...">
            <input type="email" id="reg-email" placeholder="Correo electrónico...">
            <input type="password" id="reg-pass" placeholder="Contraseña segura...">
            
            <label>Selecciona tu Rol de Operador</label>
            <select id="reg-role">
                <option value="🎧">🎧 Operador de Audio / DJ</option>
                <option value="🚀">🚀 Oficial de Campo</option>
                <option value="🔥">🔥 Nodo Raver / Producción</option>
                <option value="⚡">⚡ Ingeniero Cyberpunk</option>
            </select>

            <label>Plataformas de Streaming (Vinculación)</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 10px; font-size: 0.75rem;">
                <label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" class="stream-pref" value="Spotify" style="width:auto; margin:0;"> Spotify</label>
                <label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" class="stream-pref" value="YouTube" style="width:auto; margin:0;"> YouTube</label>
                <label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" class="stream-pref" value="Netflix" style="width:auto; margin:0;"> Netflix</label>
                <label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" class="stream-pref" value="Prime" style="width:auto; margin:0;"> Amazon Prime</label>
            </div>
        </div>

        <!-- Botón de Acción Dinámico -->
        <button id="auth-main-btn" onclick="processAuth()">Iniciar Sesión</button>
        <div class="auth-switch-link" id="auth-toggle-container">
            <span onclick="toggleRegisterMode()">¿Nuevo Operador? Regístrate aquí</span>
        </div>
    </div>

    <!-- HUD PRINCIPAL -->
    <div id="main-hud" style="display:none; flex-direction: column; gap: 8px;">
        <div class="pz-header">
            <span id="header-username" style="font-weight: 700; font-size: 0.8rem;">Operador</span>
            <button onclick="switchPzTab('profile')" style="width: auto; padding: 4px 8px; font-size: 0.65rem;">Perfil</button>
        </div>

        <!-- PERFIL DE USUARIO -->
        <div id="pz-profile" class="pz-tab-content active">
            <div class="pz-card">
                <h2><i class="fa-solid fa-sliders"></i> Perfil del Operador</h2>
                <label>Nombre de usuario</label>
                <input type="text" id="profile-handle" value="">
                <label>Biografía corta</label>
                <textarea id="profile-bio" placeholder="Definición de perfil..."></textarea>
                <button onclick="saveProfile()">Guardar Cambios</button>
            </div>
        </div>
    </div>

</div>

<script>
    let isRegisterMode = false;

    function toggleRegisterMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('registration-form').style.display = isRegisterMode ? 'block' : 'none';
        document.getElementById('auth-main-btn').innerText = isRegisterMode ? 'Completar Registro' : 'Iniciar Sesión';
        document.getElementById('auth-toggle-container').innerHTML = isRegisterMode ? 
            '<span onclick="toggleRegisterMode()">¿Ya tienes cuenta? Inicia sesión</span>' : 
            '<span onclick="toggleRegisterMode()">¿Nuevo Operador? Regístrate aquí</span>';
    }

    function processAuth() {
        if(isRegisterMode) {
            const handle = document.getElementById('reg-username').value;
            if(!handle) { alert('Ingresa un nombre de operador.'); return; }
            alert(`Registro exitoso para ${handle}.`);
            toggleRegisterMode();
        } else {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-hud').style.display = 'flex';
        }
    }

    function saveProfile() {
        const handle = document.getElementById('profile-handle').value;
        if(handle) document.getElementById('header-username').innerText = handle;
        alert("Credenciales y preferencias actualizadas.");
    }

    function switchPzTab(tabId) {
        // Lógica de pestañas
    }
</script>

</body>
</html>
